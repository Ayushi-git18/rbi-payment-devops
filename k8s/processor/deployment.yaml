apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: payment-platform
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: payment-processor

  template:
    metadata:
      labels:
        app: payment-processor

    spec:
      serviceAccountName: payment-service

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: payment-processor
          image: rajatg/payment-processor:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: SERVICE_TOKEN

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: LOG_LEVEL

            - name: FAILURE_RATE
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: FAILURE_RATE

            - name: LATENCY_MS
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: LATENCY_MS

            - name: DECLINE_OVER
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: DECLINE_OVER

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
